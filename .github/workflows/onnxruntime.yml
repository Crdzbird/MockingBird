name: ONNX Runtime builds

# Builds the reduced ONNX Runtime 1.30.0 the platform packages link: one
# static library per Android ABI, Linux and Windows architecture, and a
# static xcframework for iOS and macOS, each reduced to the operators in
# scripts/ort_ops.config. The results are published as assets of the release
# named by the `tag` input, with their SHA-256 sums, for the packages to
# download pinned. Run it by hand after changing the operator list.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release to publish the builds under
        required: true
        default: onnxruntime-1.30.0-mockingbird.1

permissions:
  contents: write

jobs:
  static:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: android-arm64-v8a, os: ubuntu-24.04 }
          - { target: android-armeabi-v7a, os: ubuntu-24.04 }
          - { target: android-x86_64, os: ubuntu-24.04 }
          - { target: android-x86, os: ubuntu-24.04 }
          - { target: linux-x64, os: ubuntu-22.04 }
          - { target: linux-aarch64, os: ubuntu-22.04-arm }
          - { target: windows-x64, os: windows-2025, msvc: x64 }
          - { target: windows-arm64, os: windows-11-arm, msvc: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: microsoft/onnxruntime
          ref: v1.30.0
          path: onnxruntime
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install flatbuffers
      - if: matrix.msvc
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - name: Build
        shell: bash
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          scripts/build_ort_static.sh onnxruntime ${{ matrix.target }} out
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            out/*.tgz
            out/*.zip

  apple:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: microsoft/onnxruntime
          ref: v1.30.0
          path: onnxruntime
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install flatbuffers
      - name: Build
        run: scripts/build_ort_apple.sh onnxruntime out
      - uses: actions/upload-artifact@v7
        with:
          name: apple
          path: out/framework_out/onnxruntime.xcframework.zip

  publish:
    needs: [static, apple]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cd assets
          mv onnxruntime.xcframework.zip onnxruntime-mockingbird-1.30.0-apple.xcframework.zip
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          notes="ONNX Runtime 1.30.0 reduced to the operators Mockingbird's models use, built by the ONNX Runtime builds workflow from ${GITHUB_SHA}. MIT licensed, see LICENSE and ThirdPartyNotices.txt inside each archive."
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --notes "$notes"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber ./*
