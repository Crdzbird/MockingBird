name: Web demo

# Builds the example app for the web and publishes it with GitHub Pages at
# https://crdzbird.github.io/MockingBird/.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/configure-pages@v6
      - name: Build the example for the web
        working-directory: packages/mockingbird/example
        run: flutter build web --release --base-href /MockingBird/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/mockingbird/example/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
