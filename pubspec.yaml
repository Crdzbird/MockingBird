name: mockingbird_workspace
description: Pub workspace for local development of the mockingbird packages.
publish_to: none

environment:
  sdk: ^3.11.0

workspace:
  - packages/mockingbird_platform_interface
  - packages/mockingbird_android
  - packages/mockingbird_ios
  - packages/mockingbird_macos
  - packages/mockingbird_linux
  - packages/mockingbird_windows
  - packages/mockingbird_web
  - packages/mockingbird
  - packages/mockingbird/example
