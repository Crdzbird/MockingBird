name: auris_bench
description: Auris side of the package comparison benchmark.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.0

dependencies:
  auris:
    path: ../../../packages/auris
  flutter:
    sdk: flutter
  harness:
    path: ../harness

flutter:
  uses-material-design: false

dependency_overrides:
  auris_platform_interface:
    path: ../../../packages/auris_platform_interface
  auris_android:
    path: ../../../packages/auris_android
  auris_ios:
    path: ../../../packages/auris_ios
  auris_macos:
    path: ../../../packages/auris_macos
  auris_web:
    path: ../../../packages/auris_web
