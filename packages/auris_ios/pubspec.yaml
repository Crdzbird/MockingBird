name: auris_ios
description: iOS implementation of the auris plugin
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.11.0

flutter:
  plugin:
    implements: auris
    platforms:
      ios:
        pluginClass: AurisPlugin
        dartPluginClass: AurisIOS

dependencies:
  flutter:
    sdk: flutter
  auris_platform_interface:
    path: ../auris_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8
  very_good_analysis: ^11.0.0
