name: mockingbird_macos
description: >-
  The macOS implementation of the mockingbird plugin: the Auris engine built from source with Core Audio capture and ONNX Runtime detectors.
version: 0.1.0
repository: https://github.com/Crdzbird/MockingBird/tree/main/packages/mockingbird_macos
issue_tracker: https://github.com/Crdzbird/MockingBird/issues
topics:
  - audio
  - vad
  - macos
  - ffi
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.44.0"

flutter:
  plugin:
    implements: mockingbird
    platforms:
      macos:
        pluginClass: AurisPlugin
        dartPluginClass: AurisMacOS

dependencies:
  flutter:
    sdk: flutter
  mockingbird_platform_interface: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
