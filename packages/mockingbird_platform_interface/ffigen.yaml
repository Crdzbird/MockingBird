# ffigen config for the Mockingbird C ABI.
#
# Generates lib/src/bindings.dart from include/mockingbird/mockingbird.h. Run with:
#   dart run ffigen
# from this package directory.

name: MockingbirdBindings
description: Raw FFI bindings for the mockingbird C ABI.
output: 'lib/src/bindings.dart'

headers:
  entry-points:
    - '../../include/mockingbird/mockingbird.h'
  include-directives:
    - '**mockingbird.h'

compiler-opts:
  - '-I../../include'

# Mockingbird targets clang only (iOS/macOS/Android with clang >= 17), where the
# C enum underlying type is int by default. Acknowledging that explicitly
# silences ffigen's portability warning. // VERIFY  Re-check if we ever
# add a target that uses a different enum ABI (e.g. some embedded toolchains).
silence-enum-warning: true

preamble: |
  // Generated by ffigen. DO NOT EDIT.
  // ignore_for_file: type=lint, public_member_api_docs, lines_longer_than_80_chars
  // ignore_for_file: avoid_positional_boolean_parameters, constant_identifier_names
  // ignore_for_file: non_constant_identifier_names, unused_field
