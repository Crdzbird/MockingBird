name: mockingbird_example
description: Demonstrates how to use the mockingbird plugin.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.11.0
resolution: workspace

dependencies:
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  mockingbird: ^0.1.0
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - path: assets/keyword_test.onnx
      platforms: [android, ios, macos, linux, windows]
    - path: assets/keyword_test.ort
      platforms: [web]
